name: Client CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'veyra-client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'veyra-client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veyra-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: veyra-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build client bundle
        run: npm run build
