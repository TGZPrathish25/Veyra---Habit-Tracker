name: Server Deploy

on:
  push:
    branches: [main]
    paths:
      - 'veyra-server/**'
      - '.github/workflows/server-deploy.yml'

jobs:
  deploy:
    name: Build Docker and Deploy Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veyra-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t veyra-server:latest .

      - name: Deploy step placeholder
        run: echo "Docker image built successfully; ready for push to registry or deployment to Render/Fly/Railway"
