# Root docker-compose: full-stack local development
# Usage: docker compose --profile full up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra_dev
      POSTGRES_DB: veyra_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    profiles: ["full"]
    build:
      context: ./veyra-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://veyra:veyra_dev@postgres:5432/veyra_dev
      CLIENT_ORIGIN: http://localhost:5173
      PORT: "3001"
      NODE_ENV: development
      LOG_LEVEL: debug
      FIREBASE_SERVICE_ACCOUNT: ""
    depends_on:
      postgres:
        condition: service_healthy

  client:
    profiles: ["full"]
    build:
      context: ./veyra-client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
