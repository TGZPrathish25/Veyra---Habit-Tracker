# Local dev: Postgres for veyra-server
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra_dev
      POSTGRES_DB: veyra_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
